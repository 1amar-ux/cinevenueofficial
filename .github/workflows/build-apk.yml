name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineVenue Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Capacitor Android Project
        run: |
          echo "=== RUNNING CAPACITOR SYNC ==="
          if ! npx cap sync android 2>&1 | tee sync_output.log; then
            echo "### ❌ Capacitor Sync Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat sync_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### ✅ Capacitor Sync Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Build Debug APK and AAB Bundle
        working-directory: android
        run: |
          if ! ./gradlew assembleDebug bundleDebug --stacktrace 2>&1 | tee build_output.log; then
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### ✅ Gradle Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            sync_output.log
            android/build_output.log
          retention-days: 7

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevenue-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Debug AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevenue-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30
