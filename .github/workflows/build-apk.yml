name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build CineVenue Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses and Setup local.properties
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK and AAB Bundle
        working-directory: android
        run: |
          BUILD_FAILED=0
          ./gradlew :app:assembleDebug :app:bundleDebug --stacktrace > /tmp/build.log 2>&1 || BUILD_FAILED=1
          cat /tmp/build.log
          if [ "$BUILD_FAILED" -eq 1 ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -B ci-build-log
            cp /tmp/build.log ./build_failure.log
            git add -f build_failure.log
            git commit -m "ci: capture build failure log" || true
            git push -f origin ci-build-log || true
            exit 1
          fi
          echo "=== APK OUTPUTS ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== BUNDLE OUTPUTS ==="
          ls -la app/build/outputs/bundle/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevenue-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Debug AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevenue-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab
          retention-days: 30
