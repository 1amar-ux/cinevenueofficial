name: cinevenue_mobile
description: "CineVenue Official Cross-Platform Mobile Application for Android & iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation & Deep Linking
  go_router: ^14.0.0

  # Networking & HTTP
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Secure Storage & Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Payment Gateways (Native Mobile SDKs)
  razorpay_flutter: ^1.3.7
  cashfree_pg: ^2.0.12

  # Authentication
  google_sign_in: ^6.2.1

  # Push Notifications
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.0
  flutter_local_notifications: ^17.1.1

  # QR Code Ticket Generation & Gate Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # UI, Icons & Polish
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

